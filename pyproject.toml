[project]
name = "dacoromanica_downloader"
version = "0.0.1"
description = "A package that automates downloding files from Dacoromanica"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4",
    "requests",
    "html5lib"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "types-beautifulsoup4",
    "types-html5lib",
    "types-requests",
]

[project.urls]
Repository = "https://github.com/AndreiIav/dacoromanica_downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dacoromanica_downloader = "dacoromanica_downloader.cli:run_dacoromanica_downloader"

[tool.hatch.metadata]
allow-direct-references = true